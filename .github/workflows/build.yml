name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成素材
        run: |
          pip install pillow
          python tools/prepare_assets.py

      - name: 编译单文件
        run: dotnet publish src/NaiwaPet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: NaiwaPet-win-x64
          path: dist/NaiwaPet.exe
          retention-days: 14
